<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Timeline Demo</title>
    <style>
        body { font-family: system-ui; margin: 20px; background: #1e1e1e; color: #d4d4d4; }
        .timeline { display: flex; flex-direction: column; gap: 12px; max-width: 800px; }
        .item { padding: 12px; background: #252526; border-radius: 4px; border-left: 3px solid #0e639c; }
        .item.user { border-left-color: #569cd6; }
        .item.agent { border-left-color: #4ec9b0; }
        .item.command { border-left-color: #ce9178; }
        .item.approval { border-left-color: #f48771; }
        .item.question { border-left-color: #0e639c; }
        .item.plan { border-left-color: #c586c0; }
        button { padding: 8px 16px; background: #0e639c; color: white; border: none; border-radius: 4px; cursor: pointer; margin: 4px; }
        button:hover { background: #1177bb; }
        .controls { margin-bottom: 20px; }
    </style>
</head>
<body>
    <h1>Timeline System Demo</h1>
    <div class="controls">
        <button onclick="addUser()">Add User Message</button>
        <button onclick="addAgent()">Add Agent Response</button>
        <button onclick="addCommand()">Add Command</button>
        <button onclick="addApproval()">Add Approval</button>
        <button onclick="addQuestion()">Add Question</button>
        <button onclick="addPlan()">Add Plan</button>
    </div>
    <div class="timeline" id="timeline"></div>
    <script>
        let itemCount = 0;
        function addItem(type, content) {
            const div = document.createElement('div');
            div.className = 'item ' + type;
            div.innerHTML = '<strong>' + type.charAt(0).toUpperCase() + type.slice(1) + '</strong><p>' + content + '</p>';
            document.getElementById('timeline').appendChild(div);
            itemCount++;
        }
        function addUser() { addItem('user', 'User message #' + itemCount); }
        function addAgent() { addItem('agent', 'Agent response #' + itemCount); }
        function addCommand() { addItem('command', 'ls -la'); }
        function addApproval() { addItem('approval', 'Approve: rm -rf dist/'); }
        function addQuestion() { addItem('question', 'Which approach should we use?'); }
        function addPlan() { addItem('plan', 'Step 1: Analyze\nStep 2: Implement\nStep 3: Test'); }
    </script>
</body>
</html>
