# Include this location inside the HTTPS server block for aegisy.cc.
location ^~ /desktop/ {
    root /etc/nginx/snippets;
    try_files $uri =404;
    default_type application/octet-stream;
    types {
        application/xml xml;
        application/zip zip;
        text/markdown md;
        application/octet-stream dmg exe;
    }
    charset utf-8;
    charset_types text/markdown application/xml;
    expires 5m;
}
