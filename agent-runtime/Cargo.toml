[workspace]
members = [
    "crates/aegisy-aap",
    "crates/aegisy-agentd",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
base64 = "=0.22.1"
libc = "=0.2.174"
portable-pty = "=0.9.0"
rusqlite = { version = "=0.40.1", features = ["backup", "bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = "=0.97.0"
sha2 = "=0.10.9"
similar = "=3.1.1"
tree-sitter = "=0.26.11"
tree-sitter-cpp = "=0.23.4"
tree-sitter-javascript = "=0.25.0"
tree-sitter-python = "=0.25.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-typescript = "=0.23.2"
windows-sys = "=0.61.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
