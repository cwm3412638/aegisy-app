<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' https://cdn.jsdelivr.net; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/editor/editor.main.css">
    <style>
        body { margin: 0; padding: 0; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; }
        #container { height: 100vh; display: flex; flex-direction: column; }
        #toolbar { padding: 8px; background: #2d2d30; color: #ccc; border-bottom: 1px solid #1e1e1e; display: flex; gap: 8px; align-items: center; }
        #editor { flex: 1; }
        #diffContainer { flex: 1; display: none; }
        button { padding: 6px 12px; background: #0e639c; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background: #1177bb; }
        #status { margin-left: auto; font-size: 12px; }
    </style>
</head>
<body>
    <div id="container">
        <div id="toolbar">
            <button onclick="testLargeFile()">Large File (10K lines)</button>
            <button onclick="testDiff()">Diff View</button>
            <button onclick="toggleTheme()">Toggle Theme</button>
            <button onclick="testIME()">IME Test (中文)</button>
            <button onclick="testSave()">Save Content</button>
            <span id="status">Loading Monaco...</span>
        </div>
        <div id="editor"></div>
        <div id="diffContainer"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs/loader.js"></script>
    <script>
        let editor, diffEditor;
        let currentTheme = 'vs-dark';

        require.config({ paths: { vs: 'https://cdn.jsdelivr.net/npm/monaco-editor@0.44.0/min/vs' }});

        require(['vs/editor/editor.main'], function() {
            // Create main editor
            editor = monaco.editor.create(document.getElementById('editor'), {
                value: '// Monaco Editor Test - Task 2.4\n// Test features:\n// 1. Open/Edit/Save\n// 2. Large file behavior\n// 3. Diff view\n// 4. Theme switching\n// 5. Font fallback\n// 6. Chinese IME (输入中文测试)\n\nfunction hello() {\n    console.log("Hello from Monaco!");\n}\n',
                language: 'javascript',
                theme: 'vs-dark',
                fontSize: 14,
                fontFamily: 'Menlo, Monaco, "Courier New", "Microsoft YaHei", monospace',
                automaticLayout: true,
                minimap: { enabled: true },
                scrollBeyondLastLine: false
            });

            // Create diff editor (hidden initially)
            diffEditor = monaco.editor.createDiffEditor(document.getElementById('diffContainer'), {
                theme: 'vs-dark',
                automaticLayout: true
            });

            document.getElementById('status').textContent = 'Monaco loaded ✓';
        });

        function testLargeFile() {
            const lines = [];
            for (let i = 1; i <= 10000; i++) {
                lines.push(`Line ${i}: This is sample content for large file testing. Monaco should handle this smoothly.`);
            }
            const content = lines.join('\n');
            editor.setValue(content);
            document.getElementById('status').textContent = `Large file loaded: ${content.length} chars, 10000 lines`;
        }

        function testDiff() {
            const editorDiv = document.getElementById('editor');
            const diffDiv = document.getElementById('diffContainer');

            if (diffDiv.style.display === 'none') {
                editorDiv.style.display = 'none';
                diffDiv.style.display = 'flex';

                const original = 'function hello() {\n    console.log("Original");\n}\n';
                const modified = 'function hello() {\n    console.log("Modified");\n    return true;\n}\n';

                diffEditor.setModel({
                    original: monaco.editor.createModel(original, 'javascript'),
                    modified: monaco.editor.createModel(modified, 'javascript')
                });

                document.getElementById('status').textContent = 'Diff view active';
            } else {
                editorDiv.style.display = 'flex';
                diffDiv.style.display = 'none';
                document.getElementById('status').textContent = 'Editor view active';
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'vs-dark' ? 'vs-light' : 'vs-dark';
            monaco.editor.setTheme(currentTheme);
            document.getElementById('status').textContent = `Theme: ${currentTheme}`;
        }

        function testIME() {
            editor.setValue('// IME Test - Type Chinese characters below:\n// 测试中文输入法\n// 请在下方输入中文：\n\n');
            editor.setPosition({ lineNumber: 5, column: 1 });
            editor.focus();
            document.getElementById('status').textContent = 'IME test ready - type Chinese characters';
        }

        function testSave() {
            const content = editor.getValue();
            document.getElementById('status').textContent = `Content ready to save: ${content.length} chars`;
            // In real integration, this would call editorAPI.saveFile()
            console.log('Content:', content.substring(0, 100) + '...');
        }
    </script>
</body>
</html>
