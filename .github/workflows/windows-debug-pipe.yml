# Temporary focused debug workflow for the Windows named-pipe E2E.
# Not part of the release validation matrix; dispatch manually only.
name: Debug Windows Named Pipe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-pipe:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: windows-验证-源码
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: windows-验证-源码

      - name: Build agent runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked -p aegisy-agentd --release --manifest-path agent-runtime\Cargo.toml

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtpositioning qtwebchannel qtwebengine qtwebsockets
          cache: true

      - name: Build named-pipe test
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $qtDir = Get-ChildItem "$env:QT_ROOT_DIR" -Recurse -Filter Qt6Config.cmake |
              Select-Object -First 1 -ExpandProperty DirectoryName
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON `
              -DAEGISY_REQUIRE_QT6=ON `
              "-DQt6_DIR=$qtDir"
          cmake --build build --config Release --target AegisyAgentRuntimeWindowsNamedPipeTest

      - name: Run named-pipe E2E
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          ctest --test-dir build -C Release -R agent_runtime_windows_named_pipe --output-on-failure

      - name: Build render test probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Release --target AegisyMonacoEditorRenderTest
          cmake --build build --config Release --target AegisyAgentWorkbenchRenderTest

      - name: Verify workbench bundle presence
        shell: pwsh
        run: |
          "build\workbench-web:"
          if (Test-Path build\workbench-web) {
            Get-ChildItem build\workbench-web | Select-Object -ExpandProperty Name
          } else { "MISSING" }
          "build\Release\workbench:"
          if (Test-Path build\Release\workbench) {
            Get-ChildItem build\Release\workbench | Select-Object -ExpandProperty Name
          } else { "MISSING" }

      - name: Probe monaco render test with ctest environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:AEGISY_AGENT_BACKEND = 'preview'
          $env:AEGISY_WORKBENCH_WEB_ROOT = (Resolve-Path build\workbench-web).Path
          $env:QTWEBENGINE_CHROMIUM_FLAGS = '--disable-gpu'
          "AEGISY_WORKBENCH_WEB_ROOT=$env:AEGISY_WORKBENCH_WEB_ROOT"
          $out = Join-Path $env:TEMP "monaco-probe-out.txt"
          $err = Join-Path $env:TEMP "monaco-probe-err.txt"
          $proc = Start-Process -FilePath build\Release\AegisyMonacoEditorRenderTest.exe `
              -Wait -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
          "monaco exit code: $($proc.ExitCode)"
          "--- stdout ---"
          if (Test-Path $out) { Get-Content $out | Select-Object -First 60 }
          "--- stderr ---"
          if (Test-Path $err) { Get-Content $err | Select-Object -First 60 }

      - name: Probe workbench render test with ctest environment
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:AEGISY_AGENT_BACKEND = 'preview'
          $out = Join-Path $env:TEMP "workbench-probe-out.txt"
          $err = Join-Path $env:TEMP "workbench-probe-err.txt"
          $proc = Start-Process -FilePath build\Release\AegisyAgentWorkbenchRenderTest.exe `
              -Wait -PassThru `
              -RedirectStandardOutput $out -RedirectStandardError $err
          "workbench exit code: $($proc.ExitCode)"
          "--- stdout ---"
          if (Test-Path $out) { Get-Content $out | Select-Object -First 80 }
          "--- stderr ---"
          if (Test-Path $err) { Get-Content $err | Select-Object -First 80 }
