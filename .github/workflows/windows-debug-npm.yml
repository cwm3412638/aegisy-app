# Temporary npm-in-Unicode-checkout probe. Delete with the debug campaign.
name: Debug Windows npm Unicode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-npm:
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: windows-验证-源码
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: windows-验证-源码

      - name: Probe npm in Unicode checkout
        shell: pwsh
        run: |
          node --version
          "Get-Command npm: $((Get-Command npm).Source)"
          "nodejs dir npm entries:"
          Get-ChildItem "C:\Program Files\nodejs" -Filter "npm*" |
              Select-Object -ExpandProperty Name
          $npmCli = "C:\Program Files\nodejs\node_modules\npm\bin\npm-cli.js"
          "npm-cli.js exists: $(Test-Path $npmCli)"
          "== variant A: cmd /c bat with Unicode working directory =="
          $bat = Join-Path $env:TEMP "probe-bundle.bat"
          $src = (Resolve-Path workbench-web).Path
          $lines = @(
            "cd /d `"$src`"",
            "`"C:\Program Files\nodejs\npm.cmd`" --version",
            "echo npm-version-exit=%ERRORLEVEL%"
          )
          [System.IO.File]::WriteAllLines($bat, $lines,
              [System.Text.Encoding]::GetEncoding(1252))
          cmd /c $bat
          "cmd bat exit: $LASTEXITCODE"
          "== variant B: node + npm-cli.js direct =="
          Push-Location workbench-web
          node $npmCli --version
          "node npm-cli version exit: $LASTEXITCODE"
          $outDir = "$PWD\..\build\workbench-web-node"
          cmake -E env "AEGISY_WEB_OUT_DIR=$outDir" node $npmCli run build
          "node npm-cli build exit: $LASTEXITCODE"
          Pop-Location
          "variant B output dir:"
          if (Test-Path $outDir) {
            Get-ChildItem $outDir | Select-Object -ExpandProperty Name
          } else { "MISSING" }
