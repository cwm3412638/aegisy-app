# Temporary npm-in-Unicode-checkout probe. Delete with the debug campaign.
name: Debug Windows npm Unicode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-npm:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows-验证-源码
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: windows-验证-源码

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtpositioning qtwebchannel qtwebengine qtwebsockets
          cache: true

      - name: Configure build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $qtDir = Get-ChildItem "$env:QT_ROOT_DIR" -Recurse -Filter Qt6Config.cmake |
              Select-Object -First 1 -ExpandProperty DirectoryName
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON `
              -DAEGISY_REQUIRE_QT6=ON `
              "-DQt6_DIR=$qtDir"

      - name: Dump generated web bundle build rule
        shell: pwsh
        run: |
          $vx = "build\aegisy_workbench_web.vcxproj"
          "vcxproj exists: $(Test-Path $vx)"
          if (Test-Path $vx) {
            $content = Get-Content $vx -Raw
            if ($content -match '(?s)<Command>(.*?)</Command>') {
              "--- CustomBuild Command ---"
              $Matches[1]
              "--- end ---"
            }
          }
          Select-String -Path build\CMakeCache.txt -Pattern "NPM_EXECUTABLE" | Out-String

      - name: Build web bundle target verbosely
        shell: pwsh
        run: |
          cmake --build build --config Release --target aegisy_workbench_web --verbose
          "build exit: $LASTEXITCODE"

      - name: Inspect bundle and hunt mangled directories
        shell: pwsh
        run: |
          "build\workbench-web:"
          if (Test-Path build\workbench-web) {
            Get-ChildItem build\workbench-web | Select-Object -ExpandProperty Name
          } else { "MISSING" }
          "stamp exists: $(Test-Path build\workbench-web-built.stamp)"
          "directories under checkout root:"
          Get-ChildItem . -Directory | Select-Object -ExpandProperty Name
          "directories under build:"
          Get-ChildItem build -Directory | Select-Object -ExpandProperty Name
          "workbench-web node_modules present: $(Test-Path workbench-web\node_modules)"
