# Temporary npm-in-Unicode-checkout probe. Delete with the debug campaign.
name: Debug Windows npm Unicode

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-npm:
    runs-on: windows-2022
    timeout-minutes: 30
    defaults:
      run:
        working-directory: windows-验证-源码
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          path: windows-验证-源码

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          modules: qtpositioning qtwebchannel qtwebengine qtwebsockets
          cache: true

      - name: Configure build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          $qtDir = Get-ChildItem "$env:QT_ROOT_DIR" -Recurse -Filter Qt6Config.cmake |
              Select-Object -First 1 -ExpandProperty DirectoryName
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON `
              -DAEGISY_REQUIRE_QT6=ON `
              "-DQt6_DIR=$qtDir"

      - name: Build web bundle target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cmake --build build --config Release --target aegisy_workbench_web

      - name: Verify bundle outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          "stamp exists: $(Test-Path build\workbench-web-built.stamp)"
          "build\workbench-web:"
          if (Test-Path build\workbench-web) {
            Get-ChildItem build\workbench-web | Select-Object -ExpandProperty Name
          } else { "MISSING" }
          "build\Release\workbench:"
          if (Test-Path build\Release\workbench) {
            Get-ChildItem build\Release\workbench | Select-Object -ExpandProperty Name
          } else { "MISSING" }
          if (-not (Test-Path build\workbench-web-built.stamp)) {
            throw "bundle stamp was not created"
          }
          if (-not (Test-Path build\workbench-web\index.html)) {
            throw "bundle index.html was not produced"
          }
          if (-not (Test-Path build\workbench-web\terminal.html)) {
            throw "bundle terminal.html was not produced"
          }
          "bundle build verified"
