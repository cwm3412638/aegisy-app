name: Rust Quality And Dependency Audit

on:
  push:
    branches:
      - main
    paths:
      - agent-runtime/**
      - deny.toml
      - scripts/verify-rust-dependencies.sh
      - .github/workflows/rust-quality.yml
  pull_request:
    paths:
      - agent-runtime/**
      - deny.toml
      - scripts/verify-rust-dependencies.sh
      - .github/workflows/rust-quality.yml

permissions:
  contents: read

concurrency:
  group: rust-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust components
        shell: bash
        run: |
          rustup component add rustfmt clippy

      - name: Verify formatting
        run: cargo fmt --all --manifest-path agent-runtime/Cargo.toml -- --check

      - name: Run locked unit tests
        run: cargo test --locked --workspace --manifest-path agent-runtime/Cargo.toml

      - name: Run locked Clippy
        run: cargo clippy --locked --workspace --all-targets --manifest-path agent-runtime/Cargo.toml -- -D warnings

      - name: Verify release build
        run: cargo build --locked --workspace --manifest-path agent-runtime/Cargo.toml --release

      - name: Install pinned dependency auditor
        run: cargo install --locked cargo-deny --version 0.19.9

      - name: Run dependency audit
        run: bash scripts/verify-rust-dependencies.sh
