name: Validate Windows Runtime and Build Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .gitattributes
      - CMakeLists.txt
      - deny.toml
      - cmake/**
      - include/**
      - src/**
      - tests/**
      - workbench-web/**
      - resources.qrc
      - assets/**
      - installer.iss
      - package-windows.bat
      - agent-runtime/**
      - .github/workflows/windows-package.yml
      - release/generate-windows-appcast.ps1
      - release/smoke-test-windows-runtime.ps1
      - release/verify-windows-tls-runtime.ps1
      - release/notes/*-windows.md

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: windows-2022
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        working-directory: windows-验证-源码
    outputs:
      reused: ${{ steps.release_version.outputs.reused }}
      version: ${{ steps.release_version.outputs.version }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: windows-验证-源码

      - name: Verify clean Unicode checkout
        shell: pwsh
        run: |
          $checkout = (Get-Location).Path
          if ($checkout -notmatch '[^\x00-\x7F]') {
              throw "Windows validation checkout is not a Unicode path: $checkout"
          }
          $status = @(git status --porcelain=v1 --untracked-files=all)
          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect the Windows validation checkout"
          }
          if ($status.Count -ne 0) {
              throw "Windows validation checkout is not clean: $($status -join ', ')"
          }
          Write-Host "Validated clean Unicode checkout: $checkout"

      - name: Detect release version reuse
        id: release_version
        shell: pwsh
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($cmake, 'project\s*\(\s*AegisyClient\s+VERSION\s+([0-9]+(?:\.[0-9]+)+)')
          if (-not $match.Success) {
              throw "Cannot read the AegisyClient version from CMakeLists.txt"
          }
          $version = $match.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          $publishedPaths = @(
              "dist/AegisyClientSetup-$version.exe",
              "dist/updates/windows/AegisyClientSetup-$version.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ }
          $publishedAppcasts = @(
              "dist/windows-appcast.xml",
              "dist/updates/windows/appcast.xml"
          ) | Where-Object {
              (Test-Path -LiteralPath $_) -and
              (Select-String -LiteralPath $_ -SimpleMatch "AegisyClientSetup-$version.exe" -Quiet)
          }
          $publishedTags = @(git tag --list "v$version" "$version") |
              Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          if ($publishedPaths.Count -gt 0 -or
              $publishedAppcasts.Count -gt 0 -or
              $publishedTags.Count -gt 0) {
              Write-Host "Version $version is already published; validation will run without rebuilding release artifacts."
              "reused=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
              "reused=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Setup Windows agent runtime toolchain
        shell: pwsh
        run: |
          # Fail closed: without these preferences PowerShell continues after a
          # failed native command, which previously let an earlier Cargo failure
          # pass when the final command exited 0.
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) {
              throw "Rust cargo is required for the bundled Aegisy Agent runtime"
          }
          rustup component add rustfmt clippy

      - name: Format Windows agent runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo fmt --all --manifest-path agent-runtime\Cargo.toml -- --check

      - name: Test Windows agent runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Capture only content-free failure identities and source locations so a
          # public check identifies the failing Rust test without exposing stdout.
          $PSNativeCommandUseErrorActionPreference = $false
          $testOutput = @(cargo test --locked --workspace --manifest-path agent-runtime\Cargo.toml 2>&1)
          $exitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
              $diagnosticLines = @(
                  $testOutput |
                      ForEach-Object { "$($_)".Trim() } |
                      Where-Object {
                          $_ -match "^(test .+ \.\.\. FAILED|---- .+ stdout ----|thread '.+' panicked at .+:[0-9]+:[0-9]+:|CONPTY_(?:INTERRUPT|DSR)_[A-Z_]+(?::[a-z-]+)?|failures:|test result: FAILED.*|error: test failed.*)$"
                      } |
                      Select-Object -Last 60
              )
              if ($diagnosticLines.Count -eq 0) {
                  $message = "cargo test failed with exit code $exitCode; no bounded failure summary was found."
              } else {
                  $message = ($diagnosticLines -join "`n")
              }
              foreach ($sensitiveRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:USERPROFILE)) {
                  if (-not [string]::IsNullOrWhiteSpace($sensitiveRoot)) {
                      $message = $message.Replace($sensitiveRoot, '<redacted-root>')
                  }
              }
              if ($message.Length -gt 2000) {
                  $message = $message.Substring($message.Length - 2000)
              }
              $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows Rust test failure::$message"
              exit $exitCode
          }

      - name: Lint Windows agent runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          node tests/windows_clippy_gate.mjs
          exit $LASTEXITCODE

      - name: Build Windows agent runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build --locked --workspace --manifest-path agent-runtime\Cargo.toml --release

      - name: Package Windows AAP schema
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo package --locked --offline --manifest-path agent-runtime\Cargo.toml -p aegisy-aap --allow-dirty

      - name: Audit Windows agent runtime dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $true
          cargo install --locked cargo-deny --version 0.19.9
          Push-Location agent-runtime
          try {
              cargo deny check --config ..\deny.toml
          } finally {
              Pop-Location
          }

      - name: Install Qt
        uses: jurplel/install-qt-action@48d3ad6db93f3627c8ee7a0454bc6f3744f7e730 # v4
        with:
          version: 6.8.3
          arch: win64_msvc2022_64
          # qtdeclarative is intentionally absent: Qt 6.8.3 ships it inside the
          # base win64_msvc2022_64 package, and passing it as a module makes
          # aqtinstall fail with "packages ['qtdeclarative'] were not found".
          modules: qtpositioning qtwebchannel qtwebengine qtwebsockets
          cache: true

      - name: Install OpenSSL runtime
        shell: pwsh
        run: |
          vcpkg install openssl:x64-windows
          $root = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed\x64-windows"
          $bin = Join-Path $root "bin"
          if (-not (Test-Path (Join-Path $bin "*.dll"))) {
              throw "No OpenSSL runtime DLLs found in $bin"
          }
          "OPENSSL_ROOT_DIR=$root" | Out-File -FilePath $env:GITHUB_ENV -Append
          "OPENSSL_DIR=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure Qt paths for CMake
        shell: pwsh
        run: |
          Write-Host "QT_ROOT_DIR  = $env:QT_ROOT_DIR"
          Write-Host "Qt6_DIR      = $env:Qt6_DIR"
          Write-Host "PATH entries containing Qt:"
          $env:PATH -split ';' | Where-Object { $_ -match 'qt' -or $_ -match 'Qt' }

          # install-qt-action sets Qt6_DIR; expose it so package-windows.bat can pass
          # -DQt6_DIR directly and skip the unreliable CMAKE_PREFIX_PATH lookup.
          if ($env:Qt6_DIR) {
              "QT_CMAKE_DIR=$env:Qt6_DIR" | Out-File -FilePath $env:GITHUB_ENV -Append
          } elseif ($env:QT_ROOT_DIR) {
              $guessed = Join-Path $env:QT_ROOT_DIR "lib\cmake\Qt6"
              "QT_CMAKE_DIR=$guessed" | Out-File -FilePath $env:GITHUB_ENV -Append
          } else {
              # Last resort: search Qt6Config.cmake under Program Files
              $found = Get-ChildItem "C:\Qt" -Recurse -Filter "Qt6Config.cmake" -ErrorAction SilentlyContinue |
                        Select-Object -First 1
              if ($found) {
                  "QT_CMAKE_DIR=$($found.DirectoryName)" | Out-File -FilePath $env:GITHUB_ENV -Append
              } else {
                  throw "Cannot locate Qt6Config.cmake; install-qt-action may have failed."
              }
          }

      - name: Configure Windows Qt agent runtime
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
              -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON `
              -DAEGISY_REQUIRE_QT6=ON `
              "-DQt6_DIR=$env:QT_CMAKE_DIR" `
              "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR"
          if ($LASTEXITCODE -ne 0) {
              $exitCode = $LASTEXITCODE
              Write-Output "::error title=Windows Qt configure failure::CMake configure failed with exit code $exitCode."
              exit $exitCode
          }

      - name: Build Windows Qt agent runtime
        shell: pwsh
        run: |
          $buildOutput = @(cmake --build build --config Release 2>&1)
          $exitCode = $LASTEXITCODE
          $buildOutput | ForEach-Object { Write-Host $_ }
          if ($exitCode -ne 0) {
              $errorLines = @(
                  $buildOutput |
                      ForEach-Object { "$_" } |
                      Select-String -Pattern 'fatal error|error (C|LNK|MSB)[0-9]+|CMake Error' |
                      Select-Object -Last 20
              )
              if ($errorLines.Count -eq 0) {
                  Write-Output "::error title=Windows Qt build failure::CMake build failed with exit code $exitCode; no recognized compiler summary was found."
              } else {
                  foreach ($line in $errorLines) {
                      $message = $line.Line.Trim()
                      if ($message.Length -gt 2000) {
                          $message = $message.Substring(0, 2000)
                      }
                      $message = $message.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                      Write-Output "::error title=Windows Qt build failure::$message"
                  }
              }
              exit $exitCode
          }

      - name: Test Windows Qt agent runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          ctest --test-dir build -C Release --no-tests=error --output-on-failure *> $null
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
              $failureLog = Join-Path $PWD 'build\Testing\Temporary\LastTestsFailed.log'
              $failedTests = @()
              if (Test-Path -LiteralPath $failureLog) {
                  $failedTests = @(
                      Get-Content -LiteralPath $failureLog |
                          Where-Object {
                              $_ -match '\A[1-9][0-9]{0,5}:[A-Za-z0-9_.-]{1,128}\z'
                          } |
                          Select-Object -First 50
                  )
              }
              if ($failedTests.Count -eq 0) {
                  Write-Output "::error title=Windows Qt test failure::CTest failed with exit code $exitCode; no failed-test summary was produced."
              } else {
                  $failureMessage = ($failedTests | ForEach-Object { $_.Trim() }) -join "`n"
                  $failureMessage = $failureMessage.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                  if ($failureMessage.Length -gt 2000) {
                      $failureMessage = $failureMessage.Substring(0, 1997)
                      $failureMessage = $failureMessage -replace '%(?:0|2)?$', ''
                      $failureMessage += '...'
                  }
                  Write-Output "::error title=Windows Qt test failure::$failureMessage"
              }
              # Public check annotations expose only the failed test names from
              # LastTestsFailed.log. Re-run that bounded set so the first useful
              # assertion/diagnostic is available without downloading job logs.
              $diagnosticLines = [System.Collections.Generic.List[string]]::new()
              $fallbackLines = [System.Collections.Generic.Queue[string]]::new()
              $markerPattern = '\A(?:[1-9][0-9]*:[ \t]*)?(?<marker>AEGISY_TEST_FAILURE: (?:QT_STDERR_CHANNEL_PROBE|TOOL_COMMAND_SHAPE|TOOL_BATCH_EXECUTION|TOOL_SHIM_RESOLUTION|TOOL_RUNTIME_REGISTRY|TOOL_NPM_RESIDUE_FIXTURE|TOOL_NPM_RESIDUE_SYNC|TOOL_NPM_RESIDUE_TIMEOUT|TOOL_NPM_RESIDUE_ASYNC|AWB_DATA_ROOT|AWB_AAP_HANDSHAKE|AWB_DURABLE_STORE|AWB_COMPOSER_READY|AWB_TIMELINE_TURN|AWB_MUTATION_ACK|AWB_RUNTIME_DEGRADATION|AWB_TIMELINE_VALIDATION|AWB_TIMELINE_GAP|AWB_TIMELINE_SUBSCRIPTION|AWB_TIMELINE_SNAPSHOT|AWB_PROPOSAL_ARTIFACT|AWB_PROPOSAL_PROJECTION|AWB_UI_BASELINE|AWB_MODEL_RECOVERY|AWB_TURN_LIFECYCLE|AWB_PROJECT_SESSION|AWB_GIT_COMPACTION|AWB_WORKSPACE_EDIT|AWB_TERMINAL_CONTEXT|AWB_CONTEXT_ARTIFACT|AWB_EDITOR_LSP|AWB_RESPONSIVE_STATE|AWB_VISIBLE_STATE|AWB_SNAPSHOT_SAVE|MONACO_DATA_ROOT|MONACO_HOST_CONTROL|MONACO_RUNTIME_READY|MONACO_WORKSPACE_FIXTURE|MONACO_TERMINAL_BRIDGE|MONACO_EDITOR_LIFECYCLE|MONACO_D3D11_PRESENTATION|MONACO_SPLIT_LIFECYCLE|MONACO_SPLIT_BLANK|MONACO_SNAPSHOT_SAVE|MONACO_SPLIT_RESTORE|MONACO_SECURITY_BOUNDARY|QT_D3D11_INITIALIZATION|WEBENGINE_GLES2_CONTEXT_CREATE|WEBENGINE_GLES3_CONTEXT_CREATE|WEBENGINE_CONTEXT_FATAL))\z'
              ctest --test-dir build -C Release --rerun-failed --output-on-failure 2>&1 |
                  ForEach-Object {
                      $line = "$_"
                      if ($line.Length -le 4096 -and $diagnosticLines.Count -lt 50) {
                          $markerMatch = [System.Text.RegularExpressions.Regex]::Match(
                              $line,
                              $markerPattern,
                              [System.Text.RegularExpressions.RegexOptions]::CultureInvariant)
                          $fixedDiagnostic = $null
                          if ($markerMatch.Success) {
                              $fixedDiagnostic = $markerMatch.Groups['marker'].Value
                          } elseif ($line -match '^(?:[1-9][0-9]*:[ \t]*)?CreateDXGIFactory2\(\) failed to create DXGI factory:') {
                              $fixedDiagnostic = 'AEGISY_TEST_FAILURE: QT_D3D11_INITIALIZATION'
                          } elseif ($line -match '^(?:[1-9][0-9]*:[ \t]*)?Failed to create D3D11 device and context:') {
                              $fixedDiagnostic = 'AEGISY_TEST_FAILURE: QT_D3D11_INITIALIZATION'
                          } elseif ($line -match '^(?:[1-9][0-9]*:[ \t]*)?ID3D11DeviceContext1 not supported') {
                              $fixedDiagnostic = 'AEGISY_TEST_FAILURE: QT_D3D11_INITIALIZATION'
                          } elseif ($line -match '^(?:[1-9][0-9]*:[ \t]*)?(?:\[[0-9]+:[0-9]+:[^\]]+\]\s*)?Failed to create GLES2 context') {
                              $fixedDiagnostic = 'AEGISY_TEST_FAILURE: WEBENGINE_GLES2_CONTEXT_CREATE'
                          } elseif ($line -match '^(?:[1-9][0-9]*:[ \t]*)?(?:\[[0-9]+:[0-9]+:[^\]]+\]\s*)?Failed to create GLES3 context') {
                              $fixedDiagnostic = 'AEGISY_TEST_FAILURE: WEBENGINE_GLES3_CONTEXT_CREATE'
                          } elseif ($line -match '^(?:[1-9][0-9]*:[ \t]*)?(?:\[[0-9]+:[0-9]+:[^\]]+\]\s*)?ContextResult::kFatalFailure') {
                              $fixedDiagnostic = 'AEGISY_TEST_FAILURE: WEBENGINE_CONTEXT_FATAL'
                          }
                          if ($null -ne $fixedDiagnostic) {
                              [void]$diagnosticLines.Add($fixedDiagnostic)
                          }
                      }
                      $fixedFallback = $null
                      if ($line.Length -le 4096) {
                          if ($line -match '^Internal ctest changing into directory:') {
                              $fixedFallback = 'CTEST_RERUN_DIRECTORY'
                          } elseif ($line -match '^Test project ') {
                              $fixedFallback = 'CTEST_RERUN_PROJECT'
                          } elseif ($line -match '^\s*Start\s+[0-9]+:') {
                              $fixedFallback = 'CTEST_RERUN_START'
                          } elseif ($line -match '^\s*[0-9]+/[0-9]+ Test\s+#?[0-9]+:') {
                              $fixedFallback = 'CTEST_RERUN_RESULT'
                          } elseif ($line -match '^The following tests FAILED:') {
                              $fixedFallback = 'CTEST_RERUN_FAILED_SET'
                          } elseif ($line -match '^Errors while running CTest') {
                              $fixedFallback = 'CTEST_RERUN_ERROR'
                          }
                      }
                      if ($null -ne $fixedFallback) {
                          if ($fallbackLines.Count -ge 20) {
                              [void]$fallbackLines.Dequeue()
                          }
                          $fallbackLines.Enqueue($fixedFallback)
                      }
                  } |
                  Out-Null
              if ($diagnosticLines.Count -eq 0) {
                  $diagnosticLines = @($fallbackLines)
              }
              if ($diagnosticLines.Count -eq 0) {
                  $diagnosticLines = @('No allowlisted assertion or graphics-context diagnostic was produced.')
              }
              $diagnosticMessage = ($diagnosticLines | ForEach-Object { $_.Trim() }) -join "`n"
              foreach ($sensitiveRoot in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:USERPROFILE)) {
                  if (-not [string]::IsNullOrWhiteSpace($sensitiveRoot)) {
                      $rootVariants = @(
                          $sensitiveRoot
                          $sensitiveRoot.Replace('\', '/')
                          $sensitiveRoot.Replace('/', '\')
                      ) | Select-Object -Unique
                      foreach ($rootVariant in $rootVariants) {
                          $diagnosticMessage = [System.Text.RegularExpressions.Regex]::Replace(
                              $diagnosticMessage,
                              [System.Text.RegularExpressions.Regex]::Escape($rootVariant),
                              '<redacted-root>',
                              [System.Text.RegularExpressions.RegexOptions]::IgnoreCase)
                      }
                  }
              }
              $diagnosticMessage = $diagnosticMessage.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              if ($diagnosticMessage.Length -gt 2000) {
                  $diagnosticMessage = $diagnosticMessage.Substring(0, 1997)
                  $diagnosticMessage = $diagnosticMessage -replace '%(?:0|2)?$', ''
                  $diagnosticMessage += '...'
              }
              Write-Output "::error title=Windows Qt test diagnostic::$diagnosticMessage"
              exit $exitCode
          }

      - name: Install Inno Setup
        if: github.ref == 'refs/heads/main' && steps.release_version.outputs.reused != 'true'
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        if: github.ref == 'refs/heads/main' && steps.release_version.outputs.reused != 'true'
        shell: cmd
        run: package-windows.bat

      - name: Verify package contents
        if: github.ref == 'refs/heads/main' && steps.release_version.outputs.reused != 'true'
        shell: pwsh
        run: |
          $version = (Get-Content build\aegisy-version.txt -Raw).Trim()
          $installer = "dist\AegisyClientSetup-$version.exe"
          if (-not (Test-Path -LiteralPath $installer)) {
              throw "Installer was not generated: $installer"
          }
          if (-not (Get-ChildItem dist\AegisyClient -Filter "libssl*.dll" -File)) {
              throw "OpenSSL SSL runtime DLL is missing from the package directory"
          }
          if (-not (Get-ChildItem dist\AegisyClient -Filter "libcrypto*.dll" -File)) {
              throw "OpenSSL crypto runtime DLL is missing from the package directory"
          }
          if (-not (Test-Path -LiteralPath "dist\AegisyClient\aegisy-agentd.exe")) {
              throw "The Aegisy Agent runtime is missing from the package directory"
          }
          Get-ChildItem dist\AegisyClient -Filter "*.dll" -File |
              Sort-Object Name |
              ForEach-Object { Write-Host $_.Name }

      - name: Upload installer artifact
        if: github.ref == 'refs/heads/main' && steps.release_version.outputs.reused != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AegisyClient-Windows-${{ github.run_id }}
          path: ${{ github.workspace }}/windows-验证-源码/dist/AegisyClientSetup-*.exe
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: validate
    if: github.ref == 'refs/heads/main' && needs.validate.outputs.reused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Check out validated source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download validated installer
        uses: actions/download-artifact@v4
        with:
          name: AegisyClient-Windows-${{ github.run_id }}
          path: .windows-installer

      - name: Commit installer to repository
        shell: bash
        env:
          AEGISY_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          installer=".windows-installer/AegisyClientSetup-${AEGISY_RELEASE_VERSION}.exe"
          if [[ ! -f "$installer" ]]; then
              echo "Installer artifact is missing: $installer" >&2
              exit 1
          fi
          cp "$installer" "dist/AegisyClientSetup-${AEGISY_RELEASE_VERSION}.exe"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f -- "dist/AegisyClientSetup-${AEGISY_RELEASE_VERSION}.exe"
          if (git diff --cached --quiet) {
              echo "Installer is already up to date"
              exit 0
          fi
          git commit -m "build: add Windows ${AEGISY_RELEASE_VERSION} installer [skip ci]"
          git push origin HEAD:main
